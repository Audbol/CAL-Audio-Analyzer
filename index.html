<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="CAL Audio Analyzer — professional real-time sound system and room acoustics analyzer in the browser." />
    <meta name="theme-color" content="#000000" />
    <title>CAL Audio Analyzer</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='calm-t' x1='0' y1='0' x2='0' y2='1'%3E%3Cstop offset='0' stop-color='#121a2a'/%3E%3Cstop offset='1' stop-color='#03050a'/%3E%3C/linearGradient%3E%3ClinearGradient id='calm-l' x1='0' y1='0' x2='1' y2='0'%3E%3Cstop offset='0' stop-color='#4d9fff'/%3E%3Cstop offset='1' stop-color='#7fe0ff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='7.3' fill='url%28#calm-t%29'/%3E%3Cg fill='#2f86ff' fill-opacity='0.35'%3E%3Crect x='5.9' y='20.4' width='2.3' height='3.4' rx='0.5'/%3E%3Crect x='8.8' y='18.3' width='2.3' height='5.5' rx='0.5'/%3E%3Crect x='11.7' y='19.1' width='2.3' height='4.7' rx='0.5'/%3E%3Crect x='14.7' y='17' width='2.3' height='6.8' rx='0.5'/%3E%3Crect x='17.6' y='17.8' width='2.3' height='6' rx='0.5'/%3E%3Crect x='20.5' y='16.1' width='2.3' height='7.7' rx='0.5'/%3E%3Crect x='23.5' y='17.6' width='2.3' height='6.2' rx='0.5'/%3E%3C/g%3E%3Cpolyline points='6.2,18.2 7.8,17.9 9.2,16.6 10.8,13.9 12.2,11.8 13.8,13 15.2,15.9 16.8,17.6 18.2,17 19.8,13.1 21.2,10.7 22.8,14.1 24.2,16.1 25.8,15.8' fill='none' stroke='url%28#calm-l%29' stroke-width='2.1' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='21' cy='10.6' r='1.9' fill='#fff'/%3E%3Ccircle cx='21' cy='10.6' r='0.95' fill='#2f86ff'/%3E%3C/svg%3E" />
    <style>
      /* Splash: shown while the app loads, faded out by main.ts once it is ready */
      #splash { position: fixed; inset: 0; z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: #000; color: #e9eef7; font: 500 14px/1.4 system-ui, -apple-system, 'Segoe UI', sans-serif; pointer-events: none; transition: opacity 0.35s ease; }
      #splash.day { background: #fff; color: #0b1220; }
      #splash .splash-mark { width: 84px; height: 84px; filter: drop-shadow(0 6px 24px rgba(47, 134, 255, 0.35)); animation: splash-in 0.5s ease-out both; }
      #splash .splash-mark svg { width: 100%; height: 100%; display: block; }
      #splash .splash-name { font-size: 22px; font-weight: 650; letter-spacing: 0.01em; animation: splash-in 0.5s 0.08s ease-out both; }
      #splash .splash-tag { font-size: 13px; opacity: 0.6; margin-top: -8px; animation: splash-in 0.5s 0.12s ease-out both; }
      #splash .splash-bar { width: 160px; height: 3px; border-radius: 3px; overflow: hidden; background: rgba(127, 140, 160, 0.25); margin-top: 10px; }
      #splash .splash-bar::after { content: ''; display: block; width: 40%; height: 100%; border-radius: 3px; background: linear-gradient(90deg, #4d9fff, #7fe0ff); animation: splash-run 1.1s ease-in-out infinite; }
      #splash .splash-ver { position: absolute; bottom: 22px; font-size: 12px; opacity: 0.45; font-variant-numeric: tabular-nums; }
      #splash.out { opacity: 0; }
      @keyframes splash-in { from { opacity: 0; transform: translateY(6px); } }
      @keyframes splash-run { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) { #splash * { animation: none !important; } #splash .splash-bar::after { width: 100%; opacity: 0.6; } }
    </style>
  </head>
  <body>
    <div id="splash" role="status" aria-label="CAL Audio Analyzer is loading">
      <div class="splash-mark"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><defs><linearGradient id="spl-t" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#121a2a"/><stop offset="1" stop-color="#03050a"/></linearGradient><linearGradient id="spl-l" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4d9fff"/><stop offset="1" stop-color="#7fe0ff"/></linearGradient></defs><rect width="32" height="32" rx="7.3" fill="url(#spl-t)"/><g fill="#2f86ff" fill-opacity="0.35"><rect x="5.9" y="20.4" width="2.3" height="3.4" rx="0.5"/><rect x="8.8" y="18.3" width="2.3" height="5.5" rx="0.5"/><rect x="11.7" y="19.1" width="2.3" height="4.7" rx="0.5"/><rect x="14.7" y="17" width="2.3" height="6.8" rx="0.5"/><rect x="17.6" y="17.8" width="2.3" height="6" rx="0.5"/><rect x="20.5" y="16.1" width="2.3" height="7.7" rx="0.5"/><rect x="23.5" y="17.6" width="2.3" height="6.2" rx="0.5"/></g><polyline points="6.2,18.2 7.8,17.9 9.2,16.6 10.8,13.9 12.2,11.8 13.8,13 15.2,15.9 16.8,17.6 18.2,17 19.8,13.1 21.2,10.7 22.8,14.1 24.2,16.1 25.8,15.8" fill="none" stroke="url(#spl-l)" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/><circle cx="21" cy="10.6" r="1.9" fill="#fff"/><circle cx="21" cy="10.6" r="0.95" fill="#2f86ff"/></svg></div>
      <div class="splash-name">CAL Audio Analyzer</div>
      <div class="splash-tag">System &amp; room measurement</div>
      <div class="splash-bar"></div>
      <div class="splash-ver"></div>
    </div>
    <script>
      // The splash follows the day theme (no flash of black before a white app)
      try { if ((JSON.parse(localStorage.getItem('cal-analyzer-settings-v1') || '{}').theme) === 'day') document.getElementById('splash').classList.add('day'); } catch (e) {}
    </script>
    <div id="app"></div>
    <noscript>CAL Audio Analyzer needs JavaScript.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
