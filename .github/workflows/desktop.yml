name: Desktop app

# Builds the standalone desktop program for Windows (installer + portable .exe), macOS (Intel + Apple Silicon)
# and Linux (x64 + ARM64). Every push produces downloadable artifacts; pushing a tag like v1.1.0 also
# publishes all of them as a GitHub Release.
on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
            name: Windows
          - os: macos-latest
            target: --mac
            name: macOS
          - os: ubuntu-latest
            target: --linux
            name: Linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build desktop app
        run: npx vite build && npx electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: CAL-Audio-Analyzer-${{ matrix.name }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
          if-no-files-found: error

  release:
    # Publish once, after every platform built successfully
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist-release
          merge-multiple: true
      - run: ls -la dist-release
      - uses: softprops/action-gh-release@v2
        with:
          name: CAL Audio Analyzer ${{ github.ref_name }}
          body_path: docs/release-notes.md
          files: dist-release/*
          fail_on_unmatched_files: true
