name: Desktop app

# Builds the standalone desktop program for Windows (installer + portable .exe), macOS (Intel + Apple Silicon)
# and Linux (x64 + ARM64). Every push produces downloadable artifacts. A GitHub Release is published when a
# tag like v1.1.0 is pushed, or when the workflow is run manually with "release" enabled (the tag v<version>
# from package.json is then created on the built commit). With "prerelease" it is published as a beta: marked as a
# pre-release, not the latest download, with the notes from docs/beta-notes.md. With "draft" it stays a draft that
# only people with write access to the repository can see, until it is published on the Releases page.
on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release:
        description: Publish a GitHub Release (tag v<package.json version>)
        type: boolean
        default: true
      prerelease:
        description: Publish it as a beta (pre-release, not the latest download; notes from docs/beta-notes.md)
        type: boolean
        default: false
      draft:
        description: Keep it as a draft (visible only to people with write access to the repository; publish it later on the Releases page)
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
            name: Windows
          - os: macos-latest
            target: --mac
            name: macOS
          - os: ubuntu-latest
            target: --linux
            name: Linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Native audio (ASIO) module, Windows only: build it, check it loads, and run its tests on the
      # virtual interface (the same code path an ASIO driver uses)
      - name: Build native audio module (ASIO)
        if: runner.os == 'Windows'
        run: npm run build:native
      - name: Test native audio module
        if: runner.os == 'Windows'
        shell: bash
        run: |
          node -e "const a=require('./native/build/Release/cal_audio.node'); console.log('APIs', a.apis(), 'RtAudio', a.version, 'ASIO drivers', a.devices('asio'))"
          CAL_NATIVE_TEST=1 npx vitest run tests/native.test.ts
      # Code signing happens only when its secrets are set (see docs/signing.md); without them the builds are
      # unsigned, as before.
      - name: Build desktop app
        shell: bash
        run: |
          npx vite build && npx vite build -c vite.native.config.ts
          ARGS=()
          if [[ "$RUNNER_OS" == "macOS" && -n "$CSC_LINK" ]]; then
            echo "Signing for macOS${APPLE_ID:+ and notarizing}"
            ARGS+=(-c.mac.hardenedRuntime=true -c.mac.gatekeeperAssess=false -c.mac.entitlements=build/entitlements.mac.plist -c.mac.entitlementsInherit=build/entitlements.mac.plist)
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            if [[ -n "$WIN_CSC_LINK" ]]; then
              echo "Signing for Windows with the certificate file"
            elif [[ -n "$AZURE_CLIENT_ID" && -n "$AZURE_SIGN_ENDPOINT" ]]; then
              echo "Signing for Windows with Azure Trusted Signing"
              ARGS+=(-c.win.azureSignOptions.endpoint="$AZURE_SIGN_ENDPOINT" -c.win.azureSignOptions.codeSigningAccountName="$AZURE_SIGN_ACCOUNT" -c.win.azureSignOptions.certificateProfileName="$AZURE_SIGN_PROFILE" -c.win.azureSignOptions.publisherName="$AZURE_SIGN_PUBLISHER")
            else
              export CSC_IDENTITY_AUTO_DISCOVERY=false
            fi
          fi
          npx electron-builder ${{ matrix.target }} --publish never "${ARGS[@]}"
        env:
          # macOS: Developer ID Application certificate (.p12, base64) and notarization
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.MAC_CERT_P12_BASE64 || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.MAC_CERT_PASSWORD || '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Windows: a code-signing certificate file (.pfx, base64) …
          WIN_CSC_LINK: ${{ secrets.WIN_CERT_PFX_BASE64 }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}
          # … or Azure Trusted Signing
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGN_ENDPOINT: ${{ vars.AZURE_SIGN_ENDPOINT }}
          AZURE_SIGN_ACCOUNT: ${{ vars.AZURE_SIGN_ACCOUNT }}
          AZURE_SIGN_PROFILE: ${{ vars.AZURE_SIGN_PROFILE }}
          AZURE_SIGN_PUBLISHER: ${{ vars.AZURE_SIGN_PUBLISHER }}
      - uses: actions/upload-artifact@v4
        with:
          name: CAL-Audio-Analyzer-${{ matrix.name }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
          if-no-files-found: error

  release:
    # Publish once, after every platform built successfully
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist-release
          merge-multiple: true
      - run: ls -la dist-release
      - name: Determine version tag
        id: tag
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT";
          else echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"; fi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: CAL Audio Analyzer ${{ steps.tag.outputs.tag }}
          prerelease: ${{ inputs.prerelease == true }}
          draft: ${{ inputs.draft == true }}
          make_latest: ${{ inputs.prerelease == true && 'false' || 'true' }}
          body_path: ${{ inputs.prerelease == true && 'docs/beta-notes.md' || 'docs/release-notes.md' }}
          files: dist-release/*
          fail_on_unmatched_files: true
